[main]
font                      = Iosevka:weight=extralight:size=24
font-bold                 = Iosevka:weight=light:size=24
line-height               = 28
font-size-adjustment      = 2
pad                       = 4x4

include                   = ~/.config/foot/colors.ini

[key-bindings]
scrollback-up-line        = Control+Shift+k
scrollback-down-line      = Control+Shift+j
scrollback-up-half-page   = Control+Alt+k
scrollback-down-half-page = Control+Alt+j
show-urls-copy            = Alt+x
color-theme-toggle        = Alt+v

[bell]
system                    = no

