background {
	path = screenshot
	blur_passes = 3
	blur_size = 5
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(d0d0d0ff)
    check_color= rgba(44aaffff)
    fail_color=rgba(ff6633ee)

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 4 

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi there, $USER
    color = rgba(200, 200, 200, 1.0)
    font_size = 35
    font_family = Iosevka Heavy

    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:10000] echo "$(date '+%H:%M')"#Hi there, $USER
    color = rgba(200, 200, 200, 1.0)
    font_size = 65
    font_family = Iosevka Heavy

    position = -50, -50
    halign = right
    valign = top
}
